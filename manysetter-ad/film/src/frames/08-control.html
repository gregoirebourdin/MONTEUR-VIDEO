<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/ms.css" />
      <style>
        {{fonts}}
        #f08 {
          position: absolute;
          inset: 0;
        }
        #f08 .ms-grid {
          -webkit-mask-image: radial-gradient(ellipse 65% 65% at 30% 55%, #000 20%, transparent 85%);
          mask-image: radial-gradient(ellipse 65% 65% at 30% 55%, #000 20%, transparent 85%);
        }
        #f08-mesh-a {
          left: 1100px;
          top: -520px;
          width: 1300px;
          height: 1100px;
          background: radial-gradient(closest-side, rgba(255,186,151,0.6) 0%, rgba(255,186,151,0.52) 10%, rgba(255,186,151,0.38) 20%, rgba(255,186,151,0.26) 30%, rgba(255,186,151,0.16) 40%, rgba(255,186,151,0.085) 50%, rgba(255,186,151,0.04) 60%, rgba(255,186,151,0.016) 70%, rgba(255,186,151,0.005) 80%, rgba(255,186,151,0) 100%);
        }
        #f08-mesh-b {
          left: -400px;
          top: 560px;
          width: 1200px;
          height: 1000px;
          background: radial-gradient(closest-side, rgba(255,216,192,0.7) 0%, rgba(255,216,192,0.6) 10%, rgba(255,216,192,0.45) 20%, rgba(255,216,192,0.3) 30%, rgba(255,216,192,0.18) 40%, rgba(255,216,192,0.1) 50%, rgba(255,216,192,0.045) 60%, rgba(255,216,192,0.018) 70%, rgba(255,216,192,0.006) 80%, rgba(255,216,192,0) 100%);
        }
        #f08-copy {
          position: absolute;
          left: 150px;
          top: 150px;
        }
        #f08-title {
          margin-top: 36px;
          font-size: 92px;
          color: var(--ink-900);
        }
        #f08-title .line {
          display: block;
          white-space: nowrap;
        }
        #f08-title .line + .line {
          margin-top: 14px;
        }
        #f08-title .accent {
          color: var(--brand-600);
        }
        #f08-title .ms-underline path {
          stroke-width: 2.3px;
        }
        #f08-flow {
          position: absolute;
          left: 150px;
          top: 560px;
          display: flex;
          align-items: center;
        }
        .f08-node {
          display: flex;
          align-items: center;
          gap: 12px;
          height: 72px;
          padding: 0 20px 0 14px;
          border-radius: 20px;
          background: var(--ink-0);
          box-shadow: var(--shadow-float);
          font: 600 21px/1 var(--font-sans);
          color: var(--ink-900);
          white-space: nowrap;
        }
        .f08-node .ic {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 44px;
          height: 44px;
          border-radius: 12px;
          background: var(--ink-100);
          color: var(--ink-700);
        }
        .f08-node .ic .ms-ico,
        .f08-node .ic .ms-brand {
          width: 22px;
          height: 22px;
        }
        .f08-node .sub {
          display: block;
          margin-top: 5px;
          font: 400 15px/1 var(--font-sans);
          color: var(--ink-500);
        }
        .f08-ig {
          color: #ff0069;
        }
        .f08-link {
          width: 40px;
          height: 3px;
          background: repeating-linear-gradient(90deg, var(--ink-300) 0 7px, transparent 7px 14px);
        }
        .f08-link.orange {
          background: repeating-linear-gradient(90deg, var(--brand-500) 0 7px, transparent 7px 14px);
        }
        #f08-ms {
          box-shadow: var(--shadow-float), 0 0 0 3px #ff611d, 0 0 0 9px #ff611d24;
        }
        #f08-ms .ms-logo-tile {
          width: 44px;
          height: 44px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #f08-ms .ms-logo-tile svg {
          width: 28px;
          height: 28px;
        }
        #f08-channels {
          position: absolute;
          left: 150px;
          top: 724px;
          display: flex;
          gap: 14px;
        }
        .f08-ch {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          height: 54px;
          padding: 0 20px 0 16px;
          border-radius: 999px;
          background: #ffffffd9;
          box-shadow: var(--shadow-card);
          font: 500 20px/1 var(--font-sans);
          color: var(--ink-800);
        }
        .f08-ch .ms-brand {
          width: 22px;
          height: 22px;
        }
        .f08-wa {
          color: #25d366;
        }
        .f08-me {
          color: #00b2ff;
        }
        #f08-inbox-pos {
          position: absolute;
          left: 1010px;
          top: 250px;
        }
        #f08-inbox-zoom {
          zoom: 1.42;
        }
        .f08-inbox {
          width: 540px;
          display: flex;
          flex-direction: column;
        }
        .f08-ihead {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 14px 16px 12px;
          border-bottom: 1px solid var(--ink-150);
        }
        .f08-ihead .name {
          font: 600 14px/1.2 var(--font-sans);
          color: var(--ink-900);
        }
        .f08-ihead .sub {
          font: 400 11.5px/1.2 var(--font-sans);
          color: var(--ink-500);
        }
        .f08-ihead .actions {
          margin-left: auto;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .f08-ihead .more {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 32px;
          height: 32px;
          border-radius: 10px;
          color: var(--ink-500);
        }
        #f08-reply {
          height: 34px;
          padding: 0 14px;
          font-size: 13px;
        }
        .f08-ai {
          margin: 12px 14px 0;
        }
        .f08-ai .ms-chip {
          height: 18px;
          font-size: 10.5px;
          padding: 0 7px;
        }
        .f08-ai .hide {
          margin-left: auto;
          font: 500 11.5px/1 var(--font-sans);
          color: var(--brand-700);
        }
        .f08-thread {
          padding: 16px 16px 12px;
        }
        .f08-thread .ms-bubble {
          max-width: 360px;
        }
        .f08-day {
          align-self: center;
          font: 500 11px/1 var(--font-sans);
          color: var(--ink-400);
          margin-bottom: 4px;
        }
        .f08-why {
          align-self: flex-end;
        }
        .f08-foot {
          position: relative;
          padding: 12px 14px 14px;
          border-top: 1px solid var(--ink-100);
        }
        .f08-foot p {
          border-radius: 12px;
          background: var(--ink-50);
          padding: 12px 14px;
          font: 400 12.5px/1.4 var(--font-sans);
          color: var(--ink-600);
        }
        #f08-compose {
          position: absolute;
          inset: 12px 14px 14px;
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 0 6px 0 14px;
          border-radius: 12px;
          background: var(--ink-0);
          box-shadow: inset 0 0 0 1px var(--ink-200), 0 0 0 4px #ff611d1f;
          font: 400 12.5px/1 var(--font-sans);
          color: var(--ink-400);
        }
        #f08-compose .send {
          margin-left: auto;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 30px;
          height: 30px;
          border-radius: 9px;
          background: linear-gradient(to bottom, var(--brand-500), var(--brand-600));
          color: #fff;
        }
        #f08-compose .send .ms-ico {
          width: 14px;
          height: 14px;
        }
        #f08-control-chip {
          position: absolute;
          left: 1010px;
          top: 186px;
        }
        #f08-control-chip .ms-chip {
          zoom: 1.6;
        }
        #f08-cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 48px;
          height: 60px;
          filter: drop-shadow(0 6px 10px #0d0c0a59);
        }
      </style>
      <div id="f08" data-composition-id="f08" data-width="1920" data-height="1080">
        <div id="f08-canvas" class="ms-canvas-light">
          <div class="ms-grid"></div>
          <div id="f08-mesh-a" class="ms-glow"></div>
          <div id="f08-mesh-b" class="ms-glow"></div>

          <div id="f08-copy">
            <span id="f08-eyebrow" class="ms-eyebrow">Manychat + ManySetter</span>
            <div id="f08-title" class="ms-display">
              <span id="f08-l1" class="line">Keep what you built.</span>
              <span id="f08-l2" class="line"
                ><span class="ms-mark-wrap accent"
                  >Add the setter.<svg class="ms-underline" viewBox="0 0 200 20" preserveAspectRatio="none"><path id="f08-underline" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M3 14.5C46 8.2 118 6.1 197 9.8" /></svg></span
              ></span>
            </div>
          </div>

          <div id="f08-flow" class="ms-ui">
            <div id="f08-n1" class="f08-node"><span class="ic">{{b:instagram:f08-ig}}</span><span>Comment<span class="sub">keyword GUIDE</span></span></div>
            <div id="f08-c1" class="f08-link"></div>
            <div id="f08-n2" class="f08-node"><span class="ic">{{i:send}}</span><span>Send the link<span class="sub">your Manychat flow</span></span></div>
            <div id="f08-c2" class="f08-link orange"></div>
            <div id="f08-ms" class="f08-node"
              ><span class="ms-logo-tile"
                ><svg viewBox="0 0 24 24" fill="none"><path d="M5.5 17.5V7.25c0-.62.75-.93 1.19-.49L12 12.06l5.31-5.3c.44-.44 1.19-.13 1.19.49V17.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span
              ><span>Your setter<span class="sub">takes it from the reply</span></span></div
            >
          </div>

          <div id="f08-channels" class="ms-ui">
            <span class="f08-ch">{{b:instagram:f08-ig}}Instagram</span>
            <span class="f08-ch">{{b:whatsapp:f08-wa}}WhatsApp</span>
            <span class="f08-ch">{{b:messenger:f08-me}}Messenger</span>
          </div>

          <div id="f08-control-chip" class="ms-ui"><span class="ms-chip green"><span class="dot"></span>You’re in control</span></div>

          <div id="f08-inbox-pos">
            <div id="f08-inbox-zoom" class="ms-ui">
              <div class="ms-window f08-inbox">
                <div class="f08-ihead">
                  <span class="ms-avatar">SK<span class="badge">{{b:instagram:f08-ig}}</span></span>
                  <div>
                    <div class="name">Sarah K.</div>
                    <div class="sub">Instagram · via Manychat</div>
                  </div>
                  <div class="actions">
                    <span id="f08-reply" class="ms-btn secondary">{{i:hand}}Reply myself</span>
                    <span class="more">{{i:ellipsis}}</span>
                  </div>
                </div>
                <div class="ms-ai-summary f08-ai">
                  <div class="head">{{i:sparkles}}AI summary <span class="ms-chip">Qualified</span><span class="hide">Hide</span></div>
                  <p>Sarah coaches 6 clients and wants 10 by summer. Budget confirmed, no time to answer DMs.</p>
                  <div class="next">Next: confirm the fit call · Updated just now</div>
                </div>
                <div class="ms-thread f08-thread">
                  <span class="f08-day">Today</span>
                  <div class="ms-bubble lead">Sounds good. What happens on the call?</div>
                  <div class="ms-bubble setter">We map your DMs and see if the program fits. Still good for Wed 4:30?</div>
                  <span class="f08-why ms-why">Why this reply?</span>
                </div>
                <div class="f08-foot">
                  <p id="f08-handling">The setter is handling this conversation. Choose “Reply myself” to answer yourself.</p>
                  <div id="f08-compose">Write your reply…<span class="send">{{i:arrow-up}}</span></div>
                </div>
              </div>
            </div>
          </div>
          <svg id="f08-cursor" viewBox="0 0 24 30"><path d="M3 2.5v21.2l5.6-5.4 3.7 8.4 3.6-1.6-3.7-8.2h7.6z" fill="#fff" stroke="#0d0c0a" stroke-width="1.4" stroke-linejoin="round" /></svg>
          <div class="ms-grain"></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const X = "expo.out", SPRING = "back.out(1.6)";
        tl.fromTo("#f08-canvas", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
        tl.fromTo("#f08-mesh-a", { x: 0, y: 0 }, { x: -50, y: 30, duration: {{dur}}, ease: "sine.inOut" }, 0);
        tl.fromTo("#f08-mesh-b", { x: 0, y: 0 }, { x: 60, y: -30, duration: {{dur}}, ease: "sine.inOut" }, 0);
        // keep your Manychat flows...
        tl.fromTo("#f08-eyebrow", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: X }, 0.1);
        tl.fromTo("#f08-l1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: X }, {{cue:L7.keep}} - 0.2);
        tl.fromTo("#f08-n1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: X }, {{cue:L7.manychat}} - 0.15);
        tl.fromTo("#f08-c1", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, {{cue:L7.manychat}} + 0.1);
        tl.fromTo("#f08-n2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: X }, {{cue:L7.manychat}} + 0.15);
        // ...add the setter: it docks onto the flow
        tl.fromTo("#f08-c2", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, {{cue:L7.flows}} - 0.05);
        tl.fromTo("#f08-ms", { opacity: 0, x: 140, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: "back.out(2)" }, {{cue:L7.flows}} - 0.15);
        tl.fromTo("#f08-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: X }, {{cue:L7.flows}} - 0.1);
        tl.fromTo("#f08-underline", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "cubic-bezier(.65,0,.35,1)" }, {{cue:L7.flows}} + 0.25);
        tl.fromTo(".f08-ch", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: X, stagger: 0.08 }, {{cue:L7.flows}} + 0.3);
        // the inbox: the setter is handling it, you take over in one click
        tl.fromTo("#f08-inbox-pos", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.9, ease: X }, 0.3);
        tl.set("#f08-compose", { opacity: 0 }, 0);
        tl.fromTo("#f08-cursor", { x: 1900, y: 1100, opacity: 0 }, { x: 1600, y: 292, opacity: 1, duration: 0.6, ease: "power3.out" }, {{cue:L7.take}} - 0.45);
        tl.to("#f08-cursor", { scale: 0.86, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "10% 10%" }, {{cue:L7.over}} - 0.05);
        tl.to("#f08-reply", { scale: 0.94, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, {{cue:L7.over}} - 0.05);
        tl.to("#f08-handling", { opacity: 0, duration: 0.2 }, {{cue:L7.over}} + 0.08);
        tl.to("#f08-compose", { opacity: 1, duration: 0.3 }, {{cue:L7.over}} + 0.12);
        tl.fromTo("#f08-control-chip", { opacity: 0, y: 12, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: SPRING }, {{cue:L7.over}} + 0.2);
        tl.to("#f08-cursor", { x: 1700, y: 420, opacity: 0, duration: 0.5, ease: "power2.in" }, {{cue:L7.anytime}} + 0.2);
        // hand over
        tl.to("#f08-copy, #f08-flow, #f08-channels, #f08-inbox-pos, #f08-control-chip", { opacity: 0, duration: 0.3, ease: "power2.in" }, {{hold}});
        window.__timelines["f08"] = tl;
      </script>
    </template>
  </body>
</html>
