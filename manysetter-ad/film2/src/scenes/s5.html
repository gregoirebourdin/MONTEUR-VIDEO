<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/ms.css" />
      <link rel="stylesheet" href="assets/kinetic.css" />
      <style>
        {{fonts}}
        #s5 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--font-sans);
          color: var(--ink-900);
        }
        .s5-win {
          position: absolute;
          left: 1080px;
          width: 700px;
          border-radius: 30px;
          background: #fff;
          box-shadow: var(--shadow-float);
          overflow: hidden;
        }
        .s5-head {
          display: flex;
          align-items: center;
          gap: 14px;
          height: 92px;
          padding: 0 30px;
          border-bottom: 1px solid var(--ink-150);
        }
        .s5-head .ttl {
          font: 600 30px/1 var(--font-heading);
          letter-spacing: -0.03em;
        }
        .s5-head > .ms-ico {
          width: 28px;
          height: 28px;
          color: var(--ink-500);
        }
        .s5-head .chips {
          margin-left: auto;
          position: relative;
          height: 38px;
        }
        .s5-head .ms-chip {
          zoom: 1.65;
        }
        /* ---------- Playbook ---------- */
        #s5-pb {
          top: 196px;
          overflow: visible;
        }
        #s5-pb .body {
          padding: 28px 30px 30px;
        }
        #s5-drop {
          position: relative;
          height: 150px;
          border-radius: 22px;
          box-shadow: inset 0 0 0 2px var(--ink-200);
          background: repeating-linear-gradient(90deg, transparent 0 14px, transparent 14px 28px);
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          font: 500 22px/1 var(--font-sans);
          color: var(--ink-500);
        }
        #s5-drop-label .ms-ico {
          width: 24px;
          height: 24px;
          vertical-align: -5px;
          margin-right: 10px;
        }
        #s5-doc {
          position: absolute;
          left: 18px;
          top: 18px;
          right: 18px;
          bottom: 18px;
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 0 22px;
          border-radius: 16px;
          background: #fff;
          box-shadow: var(--shadow-popover);
        }
        #s5-doc .tile {
          flex: none;
          width: 66px;
          height: 66px;
          border-radius: 16px;
          background: var(--brand-50);
          box-shadow: inset 0 0 0 1px #ff611d38;
          color: var(--brand-600);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s5-doc .tile .ms-ico {
          width: 32px;
          height: 32px;
        }
        #s5-doc b {
          display: block;
          font: 600 25px/1 var(--font-sans);
          margin-bottom: 9px;
        }
        #s5-doc span {
          font: 400 18px/1 var(--font-sans);
          color: var(--ink-500);
        }
        #s5-doc .lines {
          margin-left: auto;
          display: flex;
          flex-direction: column;
          gap: 9px;
        }
        #s5-doc .lines i {
          display: block;
          height: 9px;
          border-radius: 5px;
          background: var(--ink-150);
        }
        #s5-prog {
          margin-top: 26px;
        }
        #s5-prog .row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          font: 500 20px/1 var(--font-sans);
          color: var(--ink-600);
        }
        #s5-prog .row span:last-child {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          color: var(--ink-500);
        }
        #s5-prog .row .ms-ico {
          width: 20px;
          height: 20px;
        }
        #s5-bar {
          margin-top: 14px;
          height: 12px;
          border-radius: 6px;
          background: var(--ink-100);
          overflow: hidden;
        }
        #s5-bar i {
          display: block;
          height: 100%;
          width: 100%;
          border-radius: 6px;
          background: linear-gradient(90deg, #ff884d, #e64b15);
          transform-origin: 0 50%;
        }
        #s5-learned {
          margin-top: 22px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }
        .s5-l {
          display: flex;
          align-items: center;
          gap: 12px;
          height: 62px;
          padding: 0 18px;
          border-radius: 16px;
          background: var(--ink-50);
          box-shadow: inset 0 0 0 1px var(--ink-150);
          font: 500 21px/1 var(--font-sans);
        }
        .s5-l .ck {
          flex: none;
          width: 30px;
          height: 30px;
          border-radius: 50%;
          background: var(--emerald-500);
          color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .s5-l .ck .ms-ico {
          width: 18px;
          height: 18px;
          stroke-width: 3;
        }
        #s5-ready {
          position: absolute;
          right: 0;
          top: 0;
        }
        /* ---------- Inbox thread ---------- */
        #s5-chat {
          top: 214px;
        }
        #s5-chat .s5-head .av {
          width: 50px;
          height: 50px;
          border-radius: 50%;
          background: linear-gradient(135deg, #e64b15, #943016);
          display: flex;
          align-items: center;
          justify-content: center;
          font: 600 20px/1 var(--font-sans);
          color: #fff;
        }
        #s5-chat .s5-head .who b {
          display: block;
          font: 600 22px/1 var(--font-sans);
          margin-bottom: 6px;
        }
        #s5-chat .s5-head .who span {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font: 400 16px/1 var(--font-sans);
          color: var(--ink-500);
        }
        #s5-chat .s5-head .who .ms-brand {
          width: 16px;
          height: 16px;
        }
        #s5-thread {
          padding: 26px 28px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .s5-b {
          max-width: 500px;
          padding: 15px 21px;
          border-radius: 26px;
          font: 400 22px/1.42 var(--font-sans);
        }
        .s5-b.lead {
          align-self: flex-start;
          border-bottom-left-radius: 8px;
          background: #fff;
          box-shadow: inset 0 0 0 1.5px var(--ink-200);
        }
        .s5-b.me {
          align-self: flex-end;
          border-bottom-right-radius: 8px;
          background: var(--ink-900);
          color: #fff;
        }
        .s5-meta {
          align-self: flex-end;
          display: inline-flex;
          align-items: center;
          gap: 7px;
          margin: -4px 4px 0;
          font: 500 15px/1 var(--font-sans);
          color: var(--brand-700);
        }
        .s5-meta .ms-ico {
          width: 15px;
          height: 15px;
        }
        #s5-booked {
          align-self: flex-end;
          width: 440px;
          margin-top: 4px;
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 18px 22px;
          border-radius: 22px;
          background: #fff;
          box-shadow: inset 0 0 0 1.5px #00bb7f66, 0 14px 30px -14px #00976766;
        }
        #s5-booked .tile {
          flex: none;
          width: 60px;
          height: 60px;
          border-radius: 16px;
          background: var(--emerald-50);
          color: var(--emerald-600);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s5-booked .tile .ms-ico {
          width: 30px;
          height: 30px;
        }
        #s5-booked b {
          display: block;
          font: 600 23px/1 var(--font-sans);
          margin-bottom: 8px;
        }
        #s5-booked span {
          font: 400 18px/1 var(--font-sans);
          color: var(--ink-500);
        }
        #s5-booked .ok {
          margin-left: auto;
          width: 34px;
          height: 34px;
          border-radius: 50%;
          background: var(--emerald-500);
          color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s5-booked .ok .ms-ico {
          width: 20px;
          height: 20px;
          stroke-width: 3;
        }
        #s5-qual {
          position: absolute;
          right: 0;
          top: 0;
        }
      </style>
      <div id="s5" data-composition-id="s5" data-width="1920" data-height="1080">
        <div class="s5-win" id="s5-pb">
          <div class="s5-head">
            {{i:book-open}}<span class="ttl">Playbook</span>
            <span class="chips"><span class="ms-chip" id="s5-draft">Draft</span><span class="ms-chip green" id="s5-ready"><span class="dot"></span>Ready</span></span>
          </div>
          <div class="body">
            <div id="s5-drop">
              <span id="s5-drop-label">{{i:link}}Add your sales page</span>
              <div id="s5-doc" data-hf-motion-blur='{"samplesPerFrame": 10}'>
                <span class="tile">{{i:file-text}}</span>
                <div><b>Sales page</b><span>yourprogram.com</span></div>
                <div class="lines"><i style="width: 150px"></i><i style="width: 120px"></i><i style="width: 136px"></i></div>
              </div>
            </div>
            <div id="s5-prog">
              <div class="row"><span id="s5-prog-label">Learning your offer…</span><span>{{i:timer}}~2 min</span></div>
              <div id="s5-bar"><i id="s5-bar-fill"></i></div>
            </div>
            <div id="s5-learned">
              <div class="s5-l"><span class="ck">{{i:check}}</span>Offer &amp; pricing</div>
              <div class="s5-l"><span class="ck">{{i:check}}</span>Objections</div>
              <div class="s5-l"><span class="ck">{{i:check}}</span>FAQ</div>
              <div class="s5-l"><span class="ck">{{i:check}}</span>Your voice</div>
            </div>
          </div>
        </div>
        <div class="s5-win" id="s5-chat">
          <div class="s5-head">
            <span class="av">E</span>
            <div class="who"><b>emma.fit</b><span>{{b:instagram}}Instagram</span></div>
            <span class="chips"><span class="ms-chip green" id="s5-qual"><span class="dot"></span>Qualified</span></span>
          </div>
          <div id="s5-thread">
            <div class="s5-b lead" id="s5-m1">Hey! How much is the program? 👀</div>
            <div class="s5-b me" id="s5-m2">Hey Emma! It's $1,500 for 8 weeks of 1:1 coaching with me 🙌</div>
            <div class="s5-b lead" id="s5-m3">I need to think about it…</div>
            <div class="s5-b me" id="s5-m4">Totally fair! Is it more the timing or the budget?</div>
            <span class="s5-meta" id="s5-why">{{i:sparkles}}Objection handled</span>
            <div id="s5-booked"><span class="tile">{{i:calendar-check}}</span><div><b>Call booked</b><span>Tue, Oct 14 · 4:30 PM</span></div><span class="ok">{{i:check}}</span></div>
          </div>
        </div>
        {{kt}}
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const pop = (sel, t, origin) => tl.fromTo(sel, { opacity: 0, y: 26, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)", transformOrigin: origin }, t);

        // ---------- I give it my sales page ----------
        tl.fromTo("#s5-pb", { opacity: 0, x: 100, scale: 0.94 }, { opacity: 1, x: 0, scale: 1, duration: 0.8, ease: "expo.out" }, {{cue:P5.i}} - 0.25);
        tl.fromTo("#s5-doc", { opacity: 0, x: -520, y: 260, rotation: -9, scale: 0.9 }, { opacity: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.75, ease: "expo.out" }, {{cue:P5.sales}} - 0.12);
        tl.fromTo("#s5-drop", { boxShadow: "inset 0 0 0 2px #e6e5e3" }, { boxShadow: "inset 0 0 0 2px #ff611d", duration: 0.25, immediateRender: false }, {{cue:P5.sales}} + 0.3);
        tl.fromTo("#s5-drop-label", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, {{cue:P5.sales}});
        // two minutes later
        tl.fromTo("#s5-bar-fill", { scaleX: 0 }, { scaleX: 0.08, duration: 0.6, ease: "power1.out" }, {{cue:P5.page}});
        tl.to("#s5-bar-fill", { scaleX: 1, duration: 0.75, ease: "power2.inOut" }, {{cue:P5.two}} - 0.05);
        // it knows my offer by heart
        tl.to("#s5-prog-label", { opacity: 0, duration: 0.15 }, {{cue:P5.knows}} - 0.1);
        gsap.utils.toArray(".s5-l").forEach((row, k) => {
          tl.fromTo(row, { opacity: 0, y: 18, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, {{cue:P5.knows}} + k * 0.17);
          tl.fromTo(row.querySelector(".ck"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, {{cue:P5.knows}} + k * 0.17 + 0.12);
        });
        tl.to("#s5-draft", { opacity: 0, scale: 0.6, duration: 0.2 }, {{cue:P5.heart}} - 0.15);
        tl.fromTo("#s5-ready", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, {{cue:P5.heart}} - 0.05);
        tl.to("#s5-pb", { opacity: 0, x: -60, scale: 0.95, filter: "blur(10px)", duration: 0.35, ease: "power2.in" }, {{bout:2}} - 0.05);

        // ---------- it answers every DM ----------
        tl.fromTo("#s5-chat", { opacity: 0, x: 100, scale: 0.94 }, { opacity: 1, x: 0, scale: 1, duration: 0.8, ease: "expo.out" }, {{cue:P5.it#3}} - 0.2);
        pop("#s5-m1", {{cue:P5.answers}} - 0.1, "0% 100%");
        pop("#s5-m2", {{cue:P5.dm}} - 0.05, "100% 100%");
        pop("#s5-m3", {{cue:P5.need}} - 0.1, "0% 100%");
        pop("#s5-m4", {{cue:P5.and}} - 0.12, "100% 100%");
        tl.fromTo("#s5-why", { opacity: 0 }, { opacity: 1, duration: 0.3 }, {{cue:P5.and}} + 0.3);
        tl.fromTo("#s5-qual", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.6)" }, {{cue:P5.fit}} - 0.04);
        tl.fromTo("#s5-booked", { opacity: 0, y: 40, scale: 0.85, rotationX: -50 }, { opacity: 1, y: 0, scale: 1, rotationX: 0, duration: 0.7, ease: "back.out(1.6)", transformPerspective: 900 }, {{cue:P5.call}} - 0.08);
        tl.fromTo("#s5-booked .ok", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, {{cue:P5.call}} + 0.3);
        // right in the DM: the camera leans in on the booked call
        tl.fromTo("#s5-chat", { scale: 1 }, { scale: 1.045, duration: Math.min(1.4, {{bout:7}} - {{cue:P5.right}} - 0.02), ease: "power2.inOut", transformOrigin: "60% 85%", immediateRender: false }, {{cue:P5.right}} - 0.1);
        tl.to("#s5-chat", { opacity: 0, x: -120, scale: 0.94, filter: "blur(14px)", duration: 0.4, ease: "power2.in" }, {{bout:7}} - 0.05);

        {{kt_js}}
        window.__timelines["s5"] = tl;
      </script>
      {{motionblur}}
    </template>
  </body>
</html>
