<!doctype html>
<html>

  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/ms.css" />
      <style>
        @font-face { font-family: "Nohemi"; src: url("assets/fonts/Nohemi-500.woff2") format("woff2"); font-weight: 500; font-display: block; }
@font-face { font-family: "Nohemi"; src: url("assets/fonts/Nohemi-600.woff2") format("woff2"); font-weight: 600; font-display: block; }
@font-face { font-family: "Inter"; src: url("assets/fonts/Inter-var.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        #f03 {
          position: absolute;
          inset: 0;
        }
        #f03-glow {
          left: 980px;
          top: 360px;
          width: 1300px;
          height: 1000px;
          background: radial-gradient(closest-side, rgba(148,48,22,0.220) 0%, rgba(148,48,22,0.189) 10%, rgba(148,48,22,0.141) 20%, rgba(148,48,22,0.095) 30%, rgba(148,48,22,0.057) 40%, rgba(148,48,22,0.031) 50%, rgba(148,48,22,0.014) 60%, rgba(148,48,22,0.006) 70%, rgba(148,48,22,0.002) 80%, rgba(148,48,22,0.000) 100%);
        }
        #f03-all {
          position: absolute;
          inset: 0;
        }
        .f03-ghost {
          position: absolute;
          border-radius: 40px;
          background: var(--ink-900);
          filter: blur(18px);
        }
        #f03-ghost-a {
          left: 1240px;
          top: 210px;
          width: 520px;
          height: 120px;
          border-bottom-right-radius: 12px;
          opacity: 0.7;
        }
        #f03-ghost-b {
          left: 1100px;
          top: 370px;
          width: 420px;
          height: 120px;
          border-bottom-left-radius: 12px;
          opacity: 0.5;
        }
        #f03-ghost-c {
          left: 1360px;
          top: 760px;
          width: 360px;
          height: 110px;
          opacity: 0.35;
        }
        #f03-type {
          position: absolute;
          left: 150px;
          top: 50%;
          translate: 0 -46%;
        }
        #f03-type .ms-eyebrow {
          margin-bottom: 56px;
        }
        .f03-line {
          display: block;
          font-size: 252px;
          color: var(--ink-50);
          white-space: nowrap;
        }
        .f03-line + .f03-line {
          margin-top: 6px;
        }
        .f03-l {
          display: inline-block;
        }
        .f03-meta {
          position: absolute;
          left: 150px;
          bottom: 96px;
          display: flex;
          align-items: center;
          gap: 18px;
          font: 500 22px/1 var(--font-sans);
          color: var(--ink-600);
        }
        .f03-meta .bar {
          width: 280px;
          height: 2px;
          background: var(--ink-800);
          position: relative;
          overflow: hidden;
        }
        .f03-meta .bar i {
          position: absolute;
          inset: 0;
          width: 100%;
          background: var(--ink-600);
        }
        
      </style>
      <div id="f03" data-composition-id="f03" data-width="1920" data-height="1080">
        <div class="ms-canvas-dark">
          <div class="ms-vignette"></div>
          <div id="f03-glow" class="ms-glow"></div>
          <div id="f03-ghost-a" class="f03-ghost"></div>
          <div id="f03-ghost-b" class="f03-ghost"></div>
          <div id="f03-ghost-c" class="f03-ghost"></div>
          <div id="f03-all"><div id="f03-type">
            <span id="f03-eyebrow" class="ms-eyebrow dark">The problem</span>
            <span class="ms-display f03-line"><span id="f03-w-good" class="f03-l">Good</span>&nbsp;<span id="f03-w-leads" class="f03-l">leads</span></span>
            <span class="ms-display f03-line"
              ><span id="f03-w-go" class="f03-l">go</span>&nbsp;<span id="f03-w-quiet" class="f03-l"
                ><span class="f03-l">q</span><span class="f03-l">u</span><span id="f03-c-i" class="f03-l">i</span><span id="f03-c-e" class="f03-l">e</span><span id="f03-c-t" class="f03-l">t</span><span id="f03-c-dot" class="f03-l">.</span></span
              ></span
            >
          </div>
          <div id="f03-meta" class="f03-meta"><span>Volume</span><span class="bar"><i id="f03-vol"></i></span></div>
          </div>
          <div class="ms-grain"></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const SLAM = "power4.out";
        tl.fromTo("#f03-glow", { scale: 1 }, { scale: 1.08, duration: 2.774, ease: "sine.inOut" }, 0);
        tl.fromTo("#f03 .ms-grain", { x: 0, y: 0 }, { x: -31, y: 19, duration: 2.774, ease: "steps(40)" }, 0);
        tl.fromTo("#f03-type", { scale: 1 }, { scale: 1.035, transformOrigin: "0% 50%", duration: 2.774, ease: "sine.out" }, 0);
        tl.fromTo(".f03-ghost", { opacity: 0 }, { opacity: 1, duration: 1.2, stagger: 0.15 }, 0);
        tl.fromTo("#f03-eyebrow", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.02);
        tl.fromTo("#f03-meta", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.1);
        tl.fromTo("#f03-vol", { width: "100%" }, { width: "18%", duration: 1.6, ease: "power2.inOut" }, 0.781);
        const slam = (sel, t) =>
          tl.fromTo(sel, { opacity: 0, y: 70, scaleY: 1.18, filter: "blur(10px)" }, { opacity: 1, y: 0, scaleY: 1, filter: "blur(0px)", duration: 0.34, ease: SLAM }, t);
        slam("#f03-w-good", 0.781 - 0.06);
        slam("#f03-w-leads", 0.981 - 0.06);
        slam("#f03-w-go", 0.781 - 0.06);
        slam("#f03-w-quiet", 1.841 - 0.06);
        // the letters of "quiet." switch off one by one
        tl.to("#f03-c-i", { color: "#d7d4d2", duration: 0.25 }, 1.841 + 0.4);
        tl.to("#f03-c-e", { color: "#585552", duration: 0.25 }, 1.841 + 0.52);
        tl.to("#f03-c-t", { color: "#2a2825", duration: 0.25 }, 1.841 + 0.64);
        tl.to("#f03-c-dot", { color: "#1f1d1a", duration: 0.25 }, 1.841 + 0.76);
        // everything goes dark before the light comes back
        tl.to("#f03-all", { opacity: 0, duration: 0.32, ease: "power2.in" }, 2.774 - 0.34);
        window.__timelines["f03"] = tl;
      </script>
    </template>
