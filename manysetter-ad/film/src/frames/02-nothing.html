<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/ms.css" />
      <style>
        {{fonts}}
        #f02 {
          position: absolute;
          inset: 0;
        }
        #f02-glow {
          left: 120px;
          top: 160px;
          width: 1100px;
          height: 900px;
          background: radial-gradient(closest-side, rgba(148,48,22,0.300) 0%, rgba(148,48,22,0.258) 10%, rgba(148,48,22,0.192) 20%, rgba(148,48,22,0.129) 30%, rgba(148,48,22,0.078) 40%, rgba(148,48,22,0.042) 50%, rgba(148,48,22,0.019) 60%, rgba(148,48,22,0.008) 70%, rgba(148,48,22,0.003) 80%, rgba(148,48,22,0.000) 100%);
        }
        #f02-glow2 {
          left: 1150px;
          top: 120px;
          width: 900px;
          height: 900px;
          background: radial-gradient(closest-side, rgba(42,40,37,0.500) 0%, rgba(42,40,37,0.430) 10%, rgba(42,40,37,0.320) 20%, rgba(42,40,37,0.215) 30%, rgba(42,40,37,0.130) 40%, rgba(42,40,37,0.070) 50%, rgba(42,40,37,0.033) 60%, rgba(42,40,37,0.013) 70%, rgba(42,40,37,0.004) 80%, rgba(42,40,37,0.000) 100%);
        }
        #f02-thread-pos {
          position: absolute;
          left: 150px;
          top: 50%;
          translate: 0 -50%;
        }
        #f02-thread-wrap {
          width: 400px;
          zoom: 2;
        }
        #f02-thread {
          display: flex;
          flex-direction: column;
          gap: 9px;
        }
        .f02-head {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 8px;
        }
        .f02-head .name {
          font: 600 14px/1.2 var(--font-sans);
          color: var(--ink-100);
        }
        .f02-head .sub {
          font: 400 12px/1.2 var(--font-sans);
          color: var(--ink-500);
        }
        .f02-past {
          display: flex;
          flex-direction: column;
          gap: 9px;
          opacity: 0.42;
          filter: saturate(0) blur(0.6px);
        }
        .f02-comment {
          align-self: flex-start;
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 9px 12px;
          border-radius: 14px;
          background: var(--ink-900);
          box-shadow: inset 0 0 0 1px var(--ink-800);
          font: 400 13px/1.3 var(--font-sans);
          color: var(--ink-300);
        }
        .f02-comment .ms-brand,
        .f02-head .badge .ms-brand {
          width: 14px;
          height: 14px;
          color: #ff0069;
        }
        .f02-head .badge .ms-brand {
          width: 9px;
          height: 9px;
        }
        .f02-kw {
          padding: 3px 7px;
          border-radius: 6px;
          background: var(--ink-800);
          font: 600 11.5px/1 var(--font-sans);
          letter-spacing: 0.04em;
          color: var(--ink-100);
        }
        .f02-label {
          align-self: flex-end;
          font: 500 11px/1 var(--font-sans);
          color: var(--ink-500);
          margin-top: 6px;
        }
        .f02-flow {
          align-self: flex-end;
          max-width: 340px;
          padding: 10px 14px;
          border-radius: 18px;
          border-bottom-right-radius: 5px;
          background: var(--ink-800);
          color: var(--ink-100);
          font: 400 14.5px/1.5 var(--font-sans);
        }
        .f02-link {
          align-self: flex-end;
          width: 260px;
          display: flex;
          gap: 10px;
          align-items: center;
          padding: 10px 12px;
          border-radius: 14px;
          background: var(--ink-900);
          box-shadow: inset 0 0 0 1px var(--ink-800);
        }
        .f02-link .ico {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 30px;
          height: 30px;
          border-radius: 8px;
          background: var(--ink-800);
          color: var(--ink-300);
        }
        .f02-link .t1 {
          font: 600 12.5px/1.3 var(--font-sans);
          color: var(--ink-100);
        }
        .f02-link .t2 {
          font: 400 11.5px/1.3 var(--font-sans);
          color: var(--ink-500);
        }
        .f02-lead {
          align-self: flex-start;
          margin-top: 12px;
          padding: 10px 14px;
          border-radius: 18px;
          border-bottom-left-radius: 5px;
          background: var(--ink-100);
          color: var(--ink-900);
          font: 500 14.5px/1.5 var(--font-sans);
          box-shadow: 0 10px 30px -10px #00000099;
        }
        .f02-typing {
          align-self: flex-end;
          margin-top: 4px;
          display: inline-flex;
          gap: 5px;
          padding: 13px 15px;
          border-radius: 18px;
          border-bottom-right-radius: 5px;
          background: var(--ink-900);
          box-shadow: inset 0 0 0 1px var(--ink-800);
        }
        .f02-typing i {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: var(--ink-400);
        }
        .f02-status {
          align-self: flex-start;
          display: inline-flex;
          align-items: center;
          gap: 7px;
          margin-top: 2px;
          font: 600 12px/1 var(--font-sans);
          color: var(--brand-400);
        }
        .f02-status .dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: var(--brand-500);
          box-shadow: 0 0 10px var(--brand-500);
        }
        #f02-counter {
          position: absolute;
          left: 1110px;
          top: 50%;
          translate: 0 -50%;
          width: 680px;
        }
        #f02-counter .ms-eyebrow {
          margin-bottom: 34px;
        }
        .f02-prev {
          white-space: nowrap;
          font-size: 110px;
          color: var(--ink-800);
          filter: blur(2px);
          margin-bottom: 10px;
        }
        .f02-now {
          white-space: nowrap;
          font-size: 204px;
          color: var(--ink-100);
        }
        .f02-rule {
          width: 100%;
          height: 2px;
          margin-top: 40px;
          background: linear-gradient(90deg, var(--ink-700), #42403c00);
        }
        .f02-caption {
          margin-top: 22px;
          font: 400 24px/1.4 var(--font-sans);
          color: var(--ink-500);
        }
        
      </style>
      <div id="f02" data-composition-id="f02" data-width="1920" data-height="1080">
        <div class="ms-canvas-dark">
          <div class="ms-vignette"></div>
          <div id="f02-glow" class="ms-glow"></div>
          <div id="f02-glow2" class="ms-glow"></div>
          <div id="f02-thread-pos"><div id="f02-thread-wrap" class="ms-ui">
            <div id="f02-thread">
              <div class="f02-past">
                <div class="f02-head">
                  <span class="ms-avatar dark">SK<span class="badge">{{b:instagram}}</span></span>
                  <div>
                    <div class="name">Sarah K.</div>
                    <div class="sub">Instagram</div>
                  </div>
                </div>
                <div class="f02-comment">{{b:instagram}}<span>Commented on your Reel</span><span class="f02-kw">GUIDE</span></div>
                <div class="f02-label">Manychat flow</div>
                <div class="f02-flow">Thanks for the comment! Here’s your link.</div>
                <div class="f02-link">
                  <span class="ico">{{i:globe}}</span>
                  <div>
                    <div class="t1">clientflow.co/guide</div>
                    <div class="t2">Free guide · 3 DMs that book calls</div>
                  </div>
                </div>
              </div>
              <div class="f02-lead">Thanks! Does it work for beginners?</div>
              <div class="f02-typing"><i style="opacity: 0.55"></i><i style="opacity: 0.28"></i><i style="opacity: 0.1"></i></div>
              <div class="f02-status"><span class="dot"></span>No reply · 2 days</div>
            </div>
          </div></div>
          <div id="f02-counter">
            <span class="ms-eyebrow dark">No reply</span>
            <div class="ms-display f02-prev">1 day</div>
            <div class="ms-display f02-now">2 days</div>
            <div class="f02-rule"></div>
            <div class="f02-caption">since the lead’s last message</div>
          </div>
          <div class="ms-grain"></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#f02-glow", { scale: 1 }, { scale: 1.05, duration: 4, ease: "sine.inOut" }, 0);
        tl.fromTo("#f02 .ms-grain", { x: 0, y: 0 }, { x: 37, y: -23, duration: 4, ease: "steps(48)" }, 0);
        window.__timelines["f02"] = tl;
      </script>
    </template>
  </body>
</html>
