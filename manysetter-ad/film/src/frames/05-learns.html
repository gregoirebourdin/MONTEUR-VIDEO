      <div id="f05" data-composition-id="f05" data-width="1920" data-height="1080">
        <div class="ms-canvas-light">
          <div class="ms-grid"></div>
          <div id="f05-mesh-a" class="ms-glow"></div>

      <script>
        // Waveform bars: deterministic heights (seeded), first 60% "played"
        (function () {
          const wave = document.getElementById("f05-wave");
          let s = 7;
          const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
          const n = 38;
          for (let i = 0; i < n; i++) {
            const env = Math.sin((Math.PI * (i + 1)) / (n + 1));
            const h = Math.round(10 + 40 * env * (0.45 + 0.55 * rnd()));
            const bar = document.createElement("i");
            bar.style.height = h + "px";
            if (i > n * 0.62) bar.className = "off";
            wave.appendChild(bar);
          }
        })();
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#f05-mesh-a", { x: 0, y: 0 }, { x: -40, y: 30, duration: 7, ease: "sine.inOut" }, 0);
        tl.fromTo("#f05-mesh-b", { x: 0, y: 0 }, { x: 50, y: -20, duration: 7, ease: "sine.inOut" }, 0);
        window.__timelines["f05"] = tl;
      </script>
