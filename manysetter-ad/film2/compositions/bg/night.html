<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/ms.css" />
      <style>
        #bgn-root {
          position: absolute;
          inset: 0;
        }
        #bgn-root .ms-grid-dark {
          -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, #000 10%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, #000 10%, transparent 75%);
        }
        #bgn-glow-a {
          left: -420px;
          top: 260px;
          width: 1500px;
          height: 1300px;
          background: radial-gradient(closest-side, rgba(230,75,21,0.3000) 0%, rgba(230,75,21,0.2769) 10%, rgba(230,75,21,0.2178) 20%, rgba(230,75,21,0.1460) 30%, rgba(230,75,21,0.0834) 40%, rgba(230,75,21,0.0406) 50%, rgba(230,75,21,0.0168) 60%, rgba(230,75,21,0.0060) 70%, rgba(230,75,21,0.0018) 80%, rgba(230,75,21,0.0005) 90%, rgba(230,75,21,0) 100%);
        }
        #bgn-glow-b {
          left: 1060px;
          top: -620px;
          width: 1400px;
          height: 1200px;
          background: radial-gradient(closest-side, rgba(188,58,23,0.2200) 0%, rgba(188,58,23,0.2031) 10%, rgba(188,58,23,0.1598) 20%, rgba(188,58,23,0.1071) 30%, rgba(188,58,23,0.0612) 40%, rgba(188,58,23,0.0298) 50%, rgba(188,58,23,0.0123) 60%, rgba(188,58,23,0.0044) 70%, rgba(188,58,23,0.0013) 80%, rgba(188,58,23,0.0003) 90%, rgba(188,58,23,0) 100%);
        }
        #bgn-pulse {
          left: 260px;
          top: -160px;
          width: 1400px;
          height: 1400px;
          background: radial-gradient(closest-side, rgba(255,97,29,0.3000) 0%, rgba(255,97,29,0.2769) 10%, rgba(255,97,29,0.2178) 20%, rgba(255,97,29,0.1460) 30%, rgba(255,97,29,0.0834) 40%, rgba(255,97,29,0.0406) 50%, rgba(255,97,29,0.0168) 60%, rgba(255,97,29,0.0060) 70%, rgba(255,97,29,0.0018) 80%, rgba(255,97,29,0.0005) 90%, rgba(255,97,29,0) 100%);
        }
      </style>
      <div id="bgn-root" data-composition-id="bgn" data-width="1920" data-height="1080">
        <div class="ms-canvas-dark">
          <div class="ms-grid-dark" id="bgn-grid"></div>
          <div id="bgn-glow-a" class="ms-glow"></div>
          <div id="bgn-glow-b" class="ms-glow"></div>
          <div id="bgn-pulse" class="ms-glow"></div>
          <div class="ms-vignette"></div>
          <div class="ms-grain"></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // slow drift: the night is alive but quiet
        tl.fromTo("#bgn-glow-a", { x: 0, y: 0 }, { x: 140, y: -60, duration: 28.774, ease: "sine.inOut" }, 0);
        tl.fromTo("#bgn-glow-b", { x: 0, y: 0 }, { x: -120, y: 50, duration: 28.774, ease: "sine.inOut" }, 0);
        tl.fromTo("#bgn-grid", { y: 0 }, { y: 64, duration: 28.774, ease: "none" }, 0);
        // the hook: the room lights up on "126", then the panic ("9 p.m."), then the doubt (P2)
        tl.fromTo("#bgn-pulse", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 5.562 - 0.05);
        tl.to("#bgn-pulse", { opacity: 0.35, scale: 1.1, duration: 2.0, ease: "sine.inOut" }, 5.562 + 0.6);
        tl.to("#bgn-pulse", { opacity: 0.9, scale: 1.05, duration: 0.25, ease: "power3.out" }, 9.711 - 0.03);
        tl.to("#bgn-pulse", { opacity: 0, scale: 1.2, duration: 0.9, ease: "power2.inOut" }, 10.443 + 0.1);
        tl.to("#bgn-glow-a, #bgn-glow-b", { opacity: 0.35, duration: 1.6, ease: "power2.inOut" }, 13.068 - 0.2);
        tl.to("#bgn-glow-a, #bgn-glow-b", { opacity: 1, duration: 0.6, ease: "power2.out" }, 15.121 - 0.3);
        tl.to("#bgn-glow-a, #bgn-glow-b", { opacity: 0.2, duration: 0.8, ease: "power2.inOut" }, 25.762 - 0.3);
        window.__timelines["bgn"] = tl;
      </script>
    </template>
  </body>
</html>
