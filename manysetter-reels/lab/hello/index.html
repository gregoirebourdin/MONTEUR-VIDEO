<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      @font-face { font-family: "Nohemi"; font-weight: 600; src: url("assets/fonts/Nohemi-600.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #140d09; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(90% 55% at 50% 40%, #4a2410 0%, #22130b 55%, #0d0c0a 100%); }
      #glow { position: absolute; left: 50%; top: 38%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 110, 40, 0.35) 0%, rgba(255, 110, 40, 0) 62%); }
      #three-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .line { position: absolute; left: 0; right: 0; top: 1420px; text-align: center;
        font: 600 112px/1 Nohemi, sans-serif; letter-spacing: -0.045em; color: #fff; }
      .line .w { display: inline-block; margin: 0 0.12em; }
      .line .o { color: #ff7a3a; }
      .sub { top: 1440px; font-size: 64px; color: #f5f3f2; opacity: 0.92; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hello" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
      <div id="glow"></div>
      <canvas id="three-layer"></canvas>
      <div class="line" id="l1"><span class="w">Hey.</span><span class="w">I'm</span><span class="w o">Setty.</span></div>
      <div class="line sub" id="l2"><span class="w">I</span><span class="w">answer</span><span class="w">your</span><span class="w">DMs.</span></div>
      <div class="line sub" id="l3"><span class="w">You</span><span class="w">take</span><span class="w">the</span><span class="w o">credit.</span></div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { createSetty, setupStage, pose, basePose } from "./assets/setty/setty.js";

      const W = 1080, H = 1920;
      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      const scene = new THREE.Scene();
      await setupStage(renderer, scene, { shadowOpacity: 0.4 });
      const setty = createSetty();
      scene.add(setty.root);
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);

      // ---- Setty's performance: a paused timeline of poses, seeked on every frame ----
      const P = basePose();
      Object.assign(P, { y: 8, squash: -0.25, dots: 0 });
      const act = gsap.timeline({ paused: true });
      const to = (t, d, p, ease = "power3.out") => act.to(P, { ...p, duration: d, ease }, t);
      to(0, 0.42, { y: 0 }, "power2.in");
      to(0.42, 0.08, { squash: 0.32 }, "power2.out");
      to(0.5, 0.5, { squash: 0 }, "elastic.out(1.2, 0.35)");
      act.set(P, { dots: 1 }, 0.55);
      // suspicious look around
      to(0.7, 0.22, { ...pose("sideEye", { lookX: -0.9 }), turn: -0.25 });
      to(1.15, 0.22, { lookX: 0.9, turn: 0.25 });
      // to camera: the signature smug face
      to(1.6, 0.28, { ...pose("smug"), turn: 0.12 }, "back.out(2.2)");
      // typing… then 126 DMs!
      to(2.45, 0.2, { ...pose("happy"), dotsBounce: 1, turn: 0 });
      to(3.15, 0.12, { ...pose("shocked"), squash: -0.18, y: 0.35 }, "power4.out");
      to(3.27, 0.4, { squash: 0, y: 0 }, "elastic.out(1, 0.4)");
      // laughs it off
      to(3.9, 0.2, { ...pose("laughing"), dotsBounce: 0 }, "back.out(2)");
      // wink + wave
      to(4.75, 0.22, { ...pose("wink"), turn: 0.18 }, "back.out(2)");
      to(5.5, 0.06, { happyR: 0, lidL: 1, lidR: 1 }, "none");
      to(5.56, 0.08, { ...pose("smug"), turn: 0.12 }, "power2.out");

      function renderAt(t) {
        act.seek(t, false);
        const bob = Math.sin(t * 2.6) * 0.07 * Math.min(1, Math.max(0, t - 0.9));
        const laugh = t > 3.9 && t < 4.75 ? Math.abs(Math.sin((t - 3.9) * 14)) * 0.12 : 0;
        const wave = t > 4.75 && t < 5.5 ? Math.sin((t - 4.75) * 16) * 0.35 : 0;
        // camera: slow push, a kick on the shock
        const shock = t > 3.15 ? Math.exp(-(t - 3.15) * 9) : 0;
        const z = 17.2 - Math.min(t, 6) * 0.3 - shock * 1.4;
        camera.position.set(Math.sin(t * 40) * 0.05 * shock, 2.1 + Math.cos(t * 37) * 0.05 * shock, z);
        camera.lookAt(0, 1.35, 0);
        setty.apply({ ...P, y: P.y + bob + laugh, armRr: P.armRr + wave, dotsPhase: t * 9 });
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);

      // ---- type: every word pops on its beat ----
      const tl = gsap.timeline({ paused: true });
      const words = (id) => document.querySelectorAll(`#${id} .w`);
      gsap.set(".w", { opacity: 0 });
      tl.fromTo(words("l1"), { opacity: 0, y: 70, scale: 0.6, rotation: -6 },
        { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(2.6)", stagger: 0.16 }, 1.65);
      tl.to("#l1", { opacity: 0, y: -40, duration: 0.18, ease: "power2.in" }, 3.1);
      tl.fromTo(words("l2"), { opacity: 0, y: 50, scale: 0.7 },
        { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "back.out(2.6)", stagger: 0.11 }, 3.3);
      tl.fromTo(words("l3"), { opacity: 0, y: 50, scale: 0.7 },
        { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "back.out(2.6)", stagger: 0.11 }, 4.75);
      tl.set("#l3", { y: 110 }, 0);
      tl.to({}, { duration: 6 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines.hello = tl;
    </script>
  </body>
</html>
