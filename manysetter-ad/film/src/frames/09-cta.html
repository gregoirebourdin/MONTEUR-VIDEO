<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/ms.css" />
      <style>
        {{fonts}}
        #f09 {
          position: absolute;
          inset: 0;
        }
        #f09-mesh-a {
          left: 360px;
          top: -700px;
          width: 1200px;
          height: 1200px;
          background: radial-gradient(closest-side, rgba(230,75,21,0.72) 0%, rgba(230,75,21,0.62) 10%, rgba(230,75,21,0.46) 20%, rgba(230,75,21,0.31) 30%, rgba(230,75,21,0.187) 40%, rgba(230,75,21,0.1) 50%, rgba(230,75,21,0.047) 60%, rgba(230,75,21,0.019) 70%, rgba(230,75,21,0.006) 80%, rgba(230,75,21,0) 100%);
        }
        #f09-mesh-b {
          left: -420px;
          top: 300px;
          width: 1000px;
          height: 1000px;
          background: radial-gradient(closest-side, rgba(148,48,22,0.45) 0%, rgba(148,48,22,0.387) 10%, rgba(148,48,22,0.288) 20%, rgba(148,48,22,0.194) 30%, rgba(148,48,22,0.117) 40%, rgba(148,48,22,0.063) 50%, rgba(148,48,22,0.029) 60%, rgba(148,48,22,0.012) 70%, rgba(148,48,22,0.004) 80%, rgba(148,48,22,0) 100%);
        }
        #f09-mesh-c {
          left: 1340px;
          top: 420px;
          width: 1000px;
          height: 1000px;
          background: radial-gradient(closest-side, rgba(188,58,23,0.34) 0%, rgba(188,58,23,0.292) 10%, rgba(188,58,23,0.218) 20%, rgba(188,58,23,0.146) 30%, rgba(188,58,23,0.088) 40%, rgba(188,58,23,0.048) 50%, rgba(188,58,23,0.022) 60%, rgba(188,58,23,0.009) 70%, rgba(188,58,23,0.003) 80%, rgba(188,58,23,0) 100%);
        }
        #f09-center {
          position: absolute;
          left: 0;
          right: 0;
          top: 176px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        #f09-lockup {
          display: flex;
          align-items: center;
          gap: 18px;
        }
        #f09-lockup .ms-logo-tile {
          width: 68px;
          height: 68px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #f09-lockup .ms-logo-tile svg {
          width: 42px;
          height: 42px;
        }
        #f09-lockup .word {
          font: 600 46px/1 var(--font-heading);
          letter-spacing: -0.04em;
          color: var(--ink-50);
        }
        #f09-title {
          margin-top: 64px;
          font-size: 108px;
          color: var(--ink-50);
        }
        #f09-title .line {
          display: block;
          white-space: nowrap;
        }
        #f09-title .line + .line {
          margin-top: 10px;
        }
        #f09-title .accent {
          color: var(--brand-400);
        }
        #f09-title .ms-underline path {
          stroke: var(--brand-500);
          stroke-width: 2.3px;
        }
        #f09-cta {
          position: relative;
          margin-top: 78px;
        }
        #f09-btn {
          height: 104px;
          padding: 0 54px 0 58px;
          border-radius: 26px;
          gap: 18px;
          font: 600 38px/1 var(--font-sans);
          letter-spacing: -0.01em;
          box-shadow: inset 0 2px 0 0 #ffffff47, inset 0 0 0 1.5px #bc3a17, 0 2px 4px 0 #73281433, 0 24px 60px -16px #e64b15b3, 0 0 0 10px #ff611d1a;
        }
        #f09-btn svg {
          width: 38px;
          height: 38px;
          stroke-width: 2.4;
        }
        #f09-cursor {
          position: absolute;
          right: -36px;
          bottom: -56px;
          transform-origin: 10% 8%;
          width: 58px;
          height: 72px;
          filter: drop-shadow(0 6px 10px #00000080);
        }
        #f09-ring {
          position: absolute;
          right: 18px;
          bottom: -2px;
          width: 60px;
          height: 60px;
          margin: -30px -30px 0 0;
          border-radius: 50%;
          box-shadow: 0 0 0 3px #ffffffb3;
        }
        #f09-checks {
          margin-top: 64px;
          display: flex;
          gap: 44px;
          font: 500 26px/1 var(--font-sans);
          color: var(--ink-300);
        }
        #f09-checks span {
          display: inline-flex;
          align-items: center;
          gap: 12px;
        }
        #f09-checks .ms-ico {
          width: 26px;
          height: 26px;
          color: var(--brand-400);
          stroke-width: 2.6;
        }
        #f09-foot {
          position: absolute;
          left: 150px;
          right: 150px;
          bottom: 86px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        #f09-url {
          font: 500 40px/1 var(--font-heading);
          letter-spacing: -0.03em;
          color: var(--ink-100);
        }
        #f09-proof {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          font: 500 24px/1 var(--font-sans);
          color: var(--ink-400);
        }
        #f09-proof .ms-ico {
          width: 26px;
          height: 26px;
          color: var(--brand-400);
        }
      </style>
      <div id="f09" data-composition-id="f09" data-width="1920" data-height="1080">
        <div id="f09-canvas" class="ms-canvas-dark">
          <div class="ms-vignette"></div>
          <div id="f09-mesh-a" class="ms-glow"></div>
          <div id="f09-mesh-b" class="ms-glow"></div>
          <div id="f09-mesh-c" class="ms-glow"></div>
          <div id="f09-center">
            <div id="f09-lockup">
              <span class="ms-logo-tile"
                ><svg viewBox="0 0 24 24" fill="none"><path d="M5.5 17.5V7.25c0-.62.75-.93 1.19-.49L12 12.06l5.31-5.3c.44-.44 1.19-.13 1.19.49V17.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg
              ></span>
              <span class="word">ManySetter</span>
            </div>
            <div id="f09-title" class="ms-display">
              <span id="f09-l1" class="line">Your next qualified lead</span>
              <span id="f09-l2" class="line"
                >may already be <span class="ms-mark-wrap accent"
                  >in your DMs.<svg class="ms-underline" viewBox="0 0 200 20" preserveAspectRatio="none"><path id="f09-underline" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M3 14.5C46 8.2 118 6.1 197 9.8" /></svg></span
              ></span>
            </div>
            <div id="f09-cta">
              <span id="f09-btn" class="ms-btn primary">Build my setter free{{i:arrow-right}}</span>
              <span id="f09-ring"></span>
              <svg id="f09-cursor" viewBox="0 0 24 30"><path d="M3 2.5v21.2l5.6-5.4 3.7 8.4 3.6-1.6-3.7-8.2h7.6z" fill="#fff" stroke="#0d0c0a" stroke-width="1.4" stroke-linejoin="round" /></svg>
            </div>
            <div id="f09-checks">
              <span class="f09-check">{{i:check}}Free to build and test</span>
              <span class="f09-check">{{i:check}}No card to start</span>
              <span class="f09-check">{{i:check}}14-day trial when you go live</span>
            </div>
          </div>
          <div id="f09-foot">
            <span id="f09-url">manysetter.com</span>
            <span id="f09-proof">{{i:shield-check}}Tested by 100+ marketing agencies</span>
          </div>
          <div class="ms-grain"></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const X = "expo.out", SPRING = "back.out(1.6)";
        tl.fromTo("#f09-canvas", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
        tl.fromTo("#f09-mesh-a", { x: 0, y: -40, scale: 0.9 }, { x: 60, y: 20, scale: 1.05, duration: {{dur}}, ease: "sine.inOut" }, 0);
        tl.fromTo("#f09-mesh-b", { x: 0, y: 0 }, { x: 40, y: -30, duration: {{dur}}, ease: "sine.inOut" }, 0);
        tl.fromTo("#f09-mesh-c", { x: 0, y: 0 }, { x: -40, y: -20, duration: {{dur}}, ease: "sine.inOut" }, 0);
        tl.fromTo("#f09-lockup", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.7, ease: X }, 0.1);
        tl.fromTo("#f09-l1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: X }, {{cue:L8.build}} - 0.2);
        tl.fromTo("#f09-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: X }, {{cue:L8.build}} + 0.05);
        tl.fromTo("#f09-underline", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "cubic-bezier(.65,0,.35,1)" }, {{cue:L8.setter}});
        // the real button, pressed
        tl.fromTo("#f09-btn", { opacity: 0, scale: 0.86, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: SPRING }, {{cue:L8.setter}} - 0.15);
        tl.fromTo("#f09-cursor", { x: 260, y: 220, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, {{cue:L8.free}} - 0.45);
        tl.to("#f09-cursor", { scale: 0.86, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, {{cue:L8.free}} + 0.12);
        tl.to("#f09-btn", { scale: 0.96, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, {{cue:L8.free}} + 0.12);
        tl.fromTo("#f09-ring", { opacity: 1, scale: 0.2 }, { opacity: 0, scale: 2.4, duration: 0.6, ease: "power2.out" }, {{cue:L8.free}} + 0.14);
        tl.fromTo(".f09-check", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: X, stagger: 0.14 }, {{cue:L8.free}} + 0.3);
        tl.fromTo("#f09-url", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: X }, {{cue:L8.manysettercom}} - 0.2);
        tl.fromTo("#f09-proof", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: X }, {{cue:L8.manysettercom}} + 0.1);
        // hand over to the end card
        tl.to("#f09-center, #f09-foot", { opacity: 0, duration: 0.45, ease: "power2.in" }, {{hold}});
        window.__timelines["f09"] = tl;
      </script>
    </template>
  </body>
</html>
