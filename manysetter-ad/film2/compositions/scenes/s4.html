      <script>
        const tl = gsap.timeline({ paused: true });
        // M path vertices in tile pixels (300px tile), for the spark that leads the stroke
        const map = (x, y) => [(12.16 + x * 1.6533) * 4.6875, (12.16 + y * 1.6533) * 4.6875];
        const pts = [map(5.5, 17.5), map(5.5, 7.25), map(6.69, 6.76), map(12, 12.06), map(17.31, 6.76), map(18.5, 7.25), map(18.5, 17.5)];
        const seg = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
        const total = seg.reduce((a, b) => a + b, 0);
        const at = (u) => {
          let d = u * total;
          for (let i = 0; i < seg.length; i++) {
            if (d <= seg[i] || i === seg.length - 1) {
              const k = Math.min(1, d / seg[i]);
              return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k];
            }
            d -= seg[i];
          }
        };
        const spark = document.getElementById("s4-spark");
        const strokes = document.querySelectorAll(".s4-m");
        const draw = { u: 0 };
        const paint = () => {
          strokes.forEach((p) => p.setAttribute("stroke-dashoffset", String(1 - draw.u)));
          const [x, y] = at(draw.u);
          spark.style.left = x + "px";
          spark.style.top = y + "px";
        };
        paint();

        const T0 = 0.400 + 0.25; // a spark in the dark, right after "Wait…"
        const MEET = 1.962;
        tl.fromTo("#s4-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, T0);
        tl.fromTo("#s4-outline", { opacity: 0 }, { opacity: 1, duration: 0.45 }, T0 + 0.1);
        tl.fromTo("#s4-fill", { opacity: 0 }, { opacity: 0.1, duration: 0.45 }, T0 + 0.1);
        tl.fromTo(spark, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, T0);
        tl.fromTo(draw, { u: 0 }, { u: 1, duration: MEET - T0 - 0.05, ease: "power2.inOut", onUpdate: paint }, T0 + 0.05);
        // "ManySetter?": the tile lights up and the light floods the frame (the day layer blooms underneath)
        tl.to(spark, { opacity: 0, scale: 2.4, duration: 0.35, ease: "power2.out" }, MEET - 0.05);
        tl.to("#s4-fill", { opacity: 1, duration: 0.3, ease: "power2.out" }, MEET - 0.1);
        tl.to("#s4-outline", { opacity: 0, duration: 0.3 }, MEET - 0.1);
        tl.to("#s4-m-final", { opacity: 1, duration: 0.25 }, MEET - 0.05);
        tl.to(".s4-m", { opacity: 0, duration: 0.35 }, MEET);
        tl.fromTo("#s4-flash", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1.2, duration: 0.35, ease: "power2.out" }, MEET - 0.05);
        tl.to("#s4-flash", { opacity: 0, scale: 2.2, duration: 0.7, ease: "power2.in" }, MEET + 0.32);
        tl.to("#s4-glow", { opacity: 0, duration: 0.6 }, MEET + 0.2);
        // lockup: the tile glides left and the wordmark sets in
        tl.to("#s4-tile", { x: -463, scale: 0.5, duration: 0.8, ease: "expo.inOut" }, MEET - 0.1);
        const chars = gsap.utils.toArray("#s4-word .s4-ch");
        tl.fromTo(chars, { opacity: 0, x: (i) => (i - 5) * 30 + 40 }, { opacity: 1, x: 0, duration: 1.0, ease: "expo.out", stagger: 0.022 }, MEET + 0.22);
        tl.fromTo("#s4-q", { scale: 0.3, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(3)", immediateRender: false }, 2.603 + 0.05);
        tl.fromTo("#s4-lockup", { scale: 1 }, { scale: 1.035, duration: 3.144 - 0.34 - MEET, ease: "sine.inOut", transformOrigin: "50% 50%" }, MEET);
        tl.to("#s4-lockup", { opacity: 0, y: -60, scale: 0.94, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, 3.144 - 0.32);
        // the plug: ManySetter appears, the wire runs up, Manychat connects
        tl.fromTo("#s4-ms", { opacity: 0, y: 60, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 3.364 - 0.05);
        tl.fromTo("#s4-mc", { opacity: 0, y: -50, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 4.165 - 0.05);
        tl.fromTo("#s4-wire", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.75, ease: "power2.inOut" }, 4.425 - 0.2);
        tl.fromTo("#s4-wire-p", { strokeDashoffset: 0 }, { strokeDashoffset: -110, duration: 7.714 - 4.425, ease: "none" }, 4.425 - 0.2);
        tl.fromTo("#s4-plug", { opacity: 0, scale: 0.2, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)" }, 4.766 - 0.02);
        tl.fromTo("#s4-conn", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 4.766 + 0.18);
        // ...and talks exactly like me
        tl.fromTo("#s4-voice", { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, 5.967 - 0.05);
        gsap.utils.toArray("#s4-voice .bars i").forEach((bar, k) => {
          tl.fromTo(bar, { scaleY: 0.25 }, { keyframes: { scaleY: [0.25, 0.9 - (k % 3) * 0.2, 0.35, 1 - (k % 2) * 0.4, 0.3] }, duration: 1.3, ease: "sine.inOut" }, 5.967 + 0.1 + k * 0.04);
        });
        tl.to("#s4-mc, #s4-ms, #s4-wire, #s4-plug, #s4-voice", { opacity: 0, x: 60, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 7.414 - 0.3);

tl.fromTo("#s4-w2", { opacity: 0, y: 14, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power2.out" }, 0.901);
