<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/ms.css" />
      <style>
        {{fonts}}
        #f07 {
          position: absolute;
          inset: 0;
        }
        #f07 .ms-grid-dark {
          -webkit-mask-image: radial-gradient(ellipse 50% 60% at 72% 50%, #000 20%, transparent 80%);
          mask-image: radial-gradient(ellipse 50% 60% at 72% 50%, #000 20%, transparent 80%);
        }
        #f07-glow {
          left: 760px;
          top: -60px;
          width: 1300px;
          height: 1200px;
          background: radial-gradient(closest-side, rgba(230,75,21,0.40) 0%, rgba(230,75,21,0.344) 10%, rgba(230,75,21,0.256) 20%, rgba(230,75,21,0.172) 30%, rgba(230,75,21,0.104) 40%, rgba(230,75,21,0.056) 50%, rgba(230,75,21,0.026) 60%, rgba(230,75,21,0.011) 70%, rgba(230,75,21,0.004) 80%, rgba(230,75,21,0) 100%);
        }
        #f07-copy {
          position: absolute;
          left: 150px;
          top: 50%;
          translate: 0 -50%;
          width: 720px;
        }
        #f07-title {
          margin-top: 40px;
          font-size: 118px;
          color: var(--ink-50);
        }
        #f07-title .line {
          display: block;
          white-space: nowrap;
        }
        #f07-title .line + .line {
          margin-top: 14px;
        }
        #f07-title .ms-oval path {
          stroke-width: 2.3px;
        }
        #f07-works {
          margin-top: 76px;
          font: 500 20px/1 var(--font-sans);
          color: var(--ink-400);
        }
        #f07-cals {
          margin-top: 20px;
          display: flex;
          gap: 18px;
        }
        .f07-cal {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          width: 168px;
          height: 150px;
          border-radius: 22px;
          background: var(--ink-0);
          box-shadow: 0 0 0 1px #ffffff14, 0 20px 40px -20px #000000cc;
          font: 600 20px/1 var(--font-sans);
          color: var(--ink-900);
        }
        .f07-cal .logo {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 58px;
          height: 58px;
          border-radius: 14px;
          background: var(--ink-100);
        }
        .f07-cal .ms-brand {
          width: 34px;
          height: 34px;
        }
        .f07-cal .ms-brand.wide {
          width: 40px;
          height: 22px;
        }
        #f07-stack {
          position: absolute;
          left: 1010px;
          top: 74px;
          width: 760px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #f07-zoom {
          zoom: 1.62;
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 440px;
        }
        .f07-pill {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 7px 14px 7px 7px;
          border-radius: 999px;
          background: var(--ink-900);
          box-shadow: 0 0 0 1px #ffffff1a, 0 0 0 5px #ff611d24, 0 10px 30px -10px #000;
        }
        .f07-pill .ms-logo-tile {
          width: 30px;
          height: 30px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .f07-pill .ms-logo-tile svg {
          width: 19px;
          height: 19px;
        }
        .f07-pill .t {
          font: 600 13px/1.2 var(--font-sans);
          color: var(--ink-0);
        }
        .f07-pill .d {
          font: 400 10.5px/1.2 var(--font-sans);
          color: var(--ink-400);
        }
        .f07-pill .live {
          width: 8px;
          height: 8px;
          margin-left: 6px;
          border-radius: 50%;
          background: var(--emerald-500);
          box-shadow: 0 0 0 3px #00bb7f33;
        }
        .f07-dash {
          width: 2px;
          height: 26px;
          background: repeating-linear-gradient(to bottom, var(--brand-500) 0 5px, transparent 5px 10px);
        }
        .f07-chat {
          width: 440px;
          padding: 14px;
          border-radius: 18px;
          background: var(--ink-50);
          box-shadow: 0 0 0 1px #ffffff1a, 0 24px 48px -24px #000;
        }
        .f07-chat .ms-bubble {
          max-width: 400px;
        }
        .f07-card {
          width: 440px;
          padding: 16px 18px 18px;
          border-radius: 18px;
          background: var(--ink-0);
          box-shadow: 0 0 0 1px #ffffff1a, 0 30px 60px -20px #000000e6, 0 0 80px -20px #ff611d66;
          transform-origin: 50% 0%;
        }
        .f07-card .row1 {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .f07-card .src {
          display: flex;
          align-items: center;
          gap: 6px;
          font: 500 11.5px/1 var(--font-sans);
          color: var(--ink-600);
        }
        .f07-card .src .ms-brand {
          width: 18px;
          height: 10px;
        }
        .f07-card h5 {
          margin-top: 12px;
          font: 600 19px/1.2 var(--font-sans);
          letter-spacing: -0.01em;
          color: var(--ink-900);
        }
        .f07-meta {
          margin-top: 10px;
          display: flex;
          flex-direction: column;
          gap: 6px;
          font: 400 13px/1.3 var(--font-sans);
          color: var(--ink-600);
        }
        .f07-meta div {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .f07-meta .ms-ico {
          width: 15px;
          height: 15px;
          color: var(--ink-400);
        }
        .f07-notes {
          margin-top: 14px;
          padding: 11px 12px;
          border-radius: 12px;
          background: var(--ink-50);
          box-shadow: inset 0 0 0 1px var(--ink-150);
        }
        .f07-notes .h {
          font: 500 11px/1 var(--font-sans);
          color: var(--ink-600);
          margin-bottom: 8px;
        }
        .f07-notes div.n {
          display: flex;
          align-items: center;
          gap: 8px;
          font: 400 12.5px/1.5 var(--font-sans);
          color: var(--ink-800);
        }
        .f07-notes .ms-ico {
          width: 14px;
          height: 14px;
          color: var(--emerald-500);
          stroke-width: 2.5;
        }
      </style>
      <div id="f07" data-composition-id="f07" data-width="1920" data-height="1080">
        <div id="f07-canvas" class="ms-canvas-dark">
          <div class="ms-vignette"></div>
          <div class="ms-grid-dark"></div>
          <div id="f07-glow" class="ms-glow"></div>
          <div id="f07-copy">
            <span id="f07-eyebrow" class="ms-eyebrow dark">Calendar</span>
            <div id="f07-title" class="ms-display">
              <span id="f07-l1" class="line">Booked right</span>
              <span id="f07-l2" class="line"
                >in <span class="ms-mark-wrap" style="margin-left: 0.32em"
                  >the DM.<svg class="ms-oval" viewBox="0 0 200 64" preserveAspectRatio="none"><path id="f07-oval" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M166 5C130 3 70 3 26 5.5C11 6.5 3 19 3 32C3 46 9.9 58 26 59.5C70 61.5 130 61.5 174 59C190.1 58 197 45 197 30.5C197 17 189 7 170 6C150 5 120 6 96 8" /></svg></span
              ></span>
            </div>
            <div id="f07-works">Books on your calendar</div>
            <div id="f07-cals">
              <div class="f07-cal"><span class="logo">{{b:calcom:wide}}</span>Cal.com</div>
              <div class="f07-cal"><span class="logo">{{b:calendly}}</span>Calendly</div>
              <div class="f07-cal"><span class="logo">{{b:iclosed}}</span>iClosed</div>
            </div>
          </div>
          <div id="f07-stack">
            <div id="f07-zoom" class="ms-ui">
              <div id="f07-pill" class="f07-pill">
                <span class="ms-logo-tile"
                  ><svg viewBox="0 0 24 24" fill="none"><path d="M5.5 17.5V7.25c0-.62.75-.93 1.19-.49L12 12.06l5.31-5.3c.44-.44 1.19-.13 1.19.49V17.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg
                ></span>
                <div>
                  <div class="t">Your setter</div>
                  <div class="d">Finds a time that works</div>
                </div>
                <span class="live"></span>
              </div>
              <div id="f07-dash1" class="f07-dash"></div>
              <div id="f07-chat" class="f07-chat">
                <div class="ms-thread">
                  <div id="f07-b1" class="ms-bubble setter">I’ve got Wed 4:30 PM or Thu 11 AM. Which works?</div>
                  <div id="f07-b2" class="ms-bubble lead">Wed 4:30 works!</div>
                </div>
              </div>
              <div id="f07-dash2" class="f07-dash"></div>
              <div id="f07-card" class="f07-card">
                <div class="row1">
                  <span id="f07-booked" class="ms-chip green"><span class="dot"></span>Call booked</span>
                  <span class="src">{{b:calcom}}Cal.com</span>
                </div>
                <h5>Discovery call · 30 min</h5>
                <div class="f07-meta">
                  <div>{{i:calendar-days}}Wed, Oct 14 · 4:30 PM</div>
                  <div>{{i:message-circle}}Sarah K. · from an Instagram DM</div>
                </div>
                <div class="f07-notes">
                  <div class="h">Notes from your setter</div>
                  <div class="n f07-note">{{i:check}}Coaches 6 clients, wants 10 by summer</div>
                  <div class="n f07-note">{{i:check}}Budget confirmed</div>
                  <div class="n f07-note">{{i:check}}No time to answer DMs</div>
                </div>
              </div>
            </div>
          </div>
          <div class="ms-grain"></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const X = "expo.out", SPRING = "back.out(1.5)";
        tl.fromTo("#f07-canvas", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
        tl.fromTo("#f07-glow", { scale: 0.85, opacity: 0.5 }, { scale: 1.05, opacity: 1, duration: {{dur}}, ease: "sine.inOut" }, 0);
        tl.fromTo("#f07 .ms-grain", { x: 0, y: 0 }, { x: 33, y: 21, duration: {{dur}}, ease: "steps(48)" }, 0);
        // left column
        tl.fromTo("#f07-eyebrow", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: X }, 0.15);
        tl.fromTo("#f07-l1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: X }, {{cue:L6.books}} - 0.2);
        tl.fromTo("#f07-l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: X }, {{cue:L6.right}} - 0.25);
        tl.fromTo("#f07-oval", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.85, ease: "cubic-bezier(.65,0,.35,1)" }, {{cue:L6.dm}} - 0.15);
        tl.fromTo("#f07-works", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
        tl.fromTo(".f07-cal", { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: X, stagger: 0.1 }, 0.55);
        // the setter offers times, the lead picks one
        tl.fromTo("#f07-pill", { opacity: 0, y: -16, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: SPRING }, 0.2);
        tl.fromTo("#f07-dash1", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.35, ease: "power2.out" }, 0.55);
        tl.fromTo("#f07-chat", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: X }, 0.6);
        tl.fromTo("#f07-b1", { opacity: 0, scale: 0.9, y: 8 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: SPRING, transformOrigin: "100% 100%" }, {{cue:L6.books}} - 0.25);
        tl.fromTo("#f07-b2", { opacity: 0, scale: 0.9, y: 8 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: SPRING, transformOrigin: "0% 100%" }, {{cue:L6.call}} + 0.25);
        // the booking card flips onto the stack
        tl.fromTo("#f07-dash2", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.3, ease: "power2.out" }, {{cue:L6.call}} + 0.55);
        tl.fromTo("#f07-card", { opacity: 0, rotationX: -88, transformPerspective: 1400, y: -10 }, { opacity: 1, rotationX: 6, y: 0, duration: 0.8, ease: "back.out(1.2)" }, {{cue:L6.call}} + 0.7);
        tl.fromTo("#f07-booked", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: SPRING }, {{cue:L6.right}} - 0.05);
        tl.fromTo(".f07-note", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: X, stagger: 0.16 }, {{cue:L6.right}} + 0.25);
        tl.to("#f07-card", { rotationX: 3, duration: 1.2, ease: "sine.inOut" }, {{cue:L6.dm}});
        // hand over
        tl.to("#f07-copy, #f07-stack", { opacity: 0, duration: 0.3, ease: "power2.in" }, {{hold}});
        window.__timelines["f07"] = tl;
      </script>
    </template>
  </body>
</html>
